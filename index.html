.slots-panel{
  min-height:0;
  display:grid;
  grid-template-rows:30px minmax(0,1fr);
  overflow:hidden;
  background:#f7f9fa;
}
.slot-viewbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:4px;
  padding:4px 5px;
  border-bottom:1px solid var(--line);
  background:#fbfcfd;
}
.slot-viewbar>span{
  font-size:6px;
  letter-spacing:.08em;
  color:#7a8792;
  font-weight:800;
  white-space:nowrap;
}
.slot-viewbuttons{display:flex;gap:3px}

  font-weight:700;
}
.slotmodebtn.active{
  background:var(--navy);
  border-color:var(--navy);
  color:#fff;
}
.slots{
  min-height:0;
  padding:6px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:6px;
  background:#f7f9fa;
}

/* COMPACT = exactly like the visual reference:
   type header on top, square image directly below, no inset card, no component name. */
.slots.compact{
  grid-template-rows:repeat(4,minmax(0,1fr));
  overflow:hidden;
}
.slots.compact .slot{
  min-height:0;
  width:100%;
  height:100%;
  border:0;
  border-radius:8px;
  padding:0;
  margin:0;
  overflow:hidden;
  background:#cfd8df;
  text-align:left;
  display:grid;
  grid-template-rows:17px minmax(0,1fr);
  gap:0;
  box-shadow:none;
}
.slots.compact .slot.active{
  outline:2px solid #58cce4;
  outline-offset:1px;
}
.slots.compact .slot .labeltop{
  position:static;
  height:17px;
  line-height:17px;
  padding:0 6px;
  margin:0;
  border:0;
  border-radius:0;
  background:#cfd8df;
  color:#667582;
  font-size:7px;
  font-weight:500;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.slots.compact .slot .labelbottom{display:none}
.slots.compact .slot .media{
  position:relative;
  /* square thumbnail: size is limited by BOTH card width and remaining row height */
  width:min(100%, calc(100% - 0px));
  height:auto;
  max-height:100%;
  aspect-ratio:1 / 1;
  align-self:start;
  justify-self:stretch;
  border:0;
  border-radius:0;
  margin:0;
  padding:0;
  overflow:hidden;
  background:#eef3f5;
}
.slots.compact .slot .media img{
  display:block;
  width:100%;
  height:100%;
  aspect-ratio:1 / 1;
  object-fit:cover;
  border:0;
  border-radius:0;
  margin:0;
}
.slots.compact .slot .placeholder{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  color:#98a5b1;
  font-size:9px;
  background:#eef3f5;
}

/* DETAILED keeps the same narrow column width.
   It adds the component name below the same edge-to-edge square image. */
.slots.detailed{
  grid-template-rows:repeat(4,minmax(0,1fr));
  overflow:hidden;
  align-content:stretch;
  gap:6px;
}
.slots.detailed .slot{
  border:0;
  border-radius:8px;
  background:#cfd8df;
  overflow:hidden;
  padding:0;
  text-align:left;
  min-height:0;

  grid-template-rows:17px minmax(0,1fr) 19px;
  gap:0;
  box-shadow:none;
}
.slots.detailed .slot.active{

}
.slots.detailed .slot .labeltop,
.slots.detailed .slot .labelbottom{

.slots.detailed .slot .labeltop{

}
.slots.detailed .slot .labelbottom{

<script>
const SLOTS=[
  ['basin','Basin'],
  ['aim','Aim'],
  ['residual','Residual Splash'],
  ['istinja','Istinja'],
  ['activation','Activation'],
  ['handwash','Handwash'],
  ['privacy','Privacy'],
  ['installation','Installation']
];
const DIMENSIONS=['Splash','Cleansing','Privacy','Usability','Cleanability','Feasibility'];
const SELECTION_WEIGHTS={Splash:25,Cleansing:20,Privacy:15,Usability:15,Cleanability:15,Feasibility:10};
const SLOT_INFLUENCE={
  basin:{Splash:1,Cleansing:.1,Privacy:.35,Usability:.65,Cleanability:.8,Feasibility:.8},
  aim:{Splash:.55,Cleansing:0,Privacy:.05,Usability:.9,Cleanability:.65,Feasibility:.9},
  residual:{Splash:1,Cleansing:0,Privacy:.35,Usability:.45,Cleanability:.8,Feasibility:.7},
  istinja:{Splash:.1,Cleansing:1,Privacy:.1,Usability:.8,Cleanability:.75,Feasibility:.7},
  activation:{Splash:0,Cleansing:.35,Privacy:0,Usability:1,Cleanability:.5,Feasibility:.8},
  handwash:{Splash:0,Cleansing:1,Privacy:.05,Usability:.65,Cleanability:.6,Feasibility:.45},
  privacy:{Splash:.2,Cleansing:0,Privacy:1,Usability:.65,Cleanability:.55,Feasibility:.6},
  installation:{Splash:.2,Cleansing:.1,Privacy:.7,Usability:.8,Cleanability:.7,Feasibility:1}
};
function C(id,slot,name,desc,image,source,sourceUrl,evidence,stats){return{id,slot,name,desc,image,source,sourceUrl,evidence,stats:Object.fromEntries(DIMENSIONS.map((d,i)=>[d,stats[i]]))}}
const BASE_COMPONENTS=[
  C('basin-optimized','basin','Basin Konvensional Teroptimasi','Bentuk basin dasar yang disederhanakan dan dioptimalkan untuk penggunaan umum. Geometrinya tetap konvensional, tetapi disesuaikan agar lebih mudah digunakan, dibersihkan, dan diproduksi.','assets/commercial.jpg','Acuan komersial / kondisi dasar','', 'benchmark',[3,1,2,5,5,5]),
  C('basin-deep30','basin','Basin Dalam ≤30°','Basin dengan area penerimaan lebih dalam dan profil bidang datang yang rendah, ditujukan untuk membantu mengendalikan percikan melalui geometri permukaan.','assets/urinals_pair.jpg','Sintesis riset · geometri sudut rendah','https://doi.org/10.1093/pnasnexus/pgaf087','research',[5,1,3,4,4,3]),
  C('basin-floorstall','basin','Basin Lantai / Stall','Basin dengan volume dan area penerimaan yang lebih besar, sekaligus menyediakan area berdiri yang lebih jelas. Membutuhkan ruang dan jejak pemasangan yang lebih besar.','assets/full_cubicle.jpg','Acuan lapangan / instalasi','', 'benchmark',[4,1,4,3,3,2]),

  C('aim-none','aim','Tanpa Panduan','Tidak ada tanda khusus untuk mengarahkan posisi berdiri atau titik sasaran. Pengguna menentukan posisi secara alami berdasarkan bentuk basin.','assets/commercial.jpg','Kondisi dasar','', 'hypothesis',[2,1,1,4,5,5]),
  C('aim-graphic','aim','Panduan Grafis','Tanda visual sederhana pada area basin menunjukkan bagian yang menjadi sasaran utama.','assets/urinals_pair.jpg','Acuan perilaku / pembanding','', 'benchmark',[4,1,1,5,5,5]),
  C('aim-integrated','aim','Target Terintegrasi','Area sasaran dibentuk langsung pada permukaan basin sehingga tidak memerlukan stiker atau tanda tambahan.','assets/commercial_detail.jpg','Hipotesis desain','', 'hypothesis',[5,1,1,5,4,4]),
  C('aim-standing','aim','Panduan Berdiri','Bentuk visual dan/atau geometri basin sekaligus memberi petunjuk mengenai posisi dan jarak berdiri yang diharapkan.','assets/nautilus.jpg','Arah sintesis riset','', 'hypothesis',[4,1,2,5,4,4]),

  C('res-none','residual','Tanpa Elemen Tambahan','Tidak menggunakan komponen khusus untuk mengendalikan percikan. Pengendalian utama mengandalkan bentuk dan permukaan basin.','assets/commercial.jpg','Kondisi dasar','', 'hypothesis',[3,1,1,5,5,5]),
  C('res-bristle','residual','Serat Fleksibel (Bristle)','Permukaan dengan tonjolan fleksibel yang membantu memecah dan meredam energi aliran sisa. Konsekuensinya, pembersihan dan perawatan perlu diperhatikan.','assets/commercial_heat.jpg','Acuan komersial pengendalian percikan','', 'benchmark',[4,1,1,3,2,4]),
  C('res-honeycomb','residual','Struktur Sarang Lebah (Honeycomb)','Permukaan berstruktur sel yang membantu memecah aliran sisa dan mengurangi energi percikan pada area penerimaan.','assets/cornucopia_heat.jpg','Acuan komersial pengendalian percikan','', 'benchmark',[4,1,1,3,3,4]),
  C('res-shield','residual','Pelindung Percikan (Splash Shield)','Elemen pelindung tambahan yang ditempatkan di sekitar area urinoir untuk menahan atau mengarahkan percikan agar tidak keluar dari area penggunaan.','assets/divider_pair.jpg','Arah konsep pengendalian percikan','', 'hypothesis',[4,1,4,4,3,3]),

  C('ist-fixed','istinja','Nozzle Tetap','Outlet air bersih dipasang secara permanen pada produk dan diarahkan ke area yang dibutuhkan untuk proses istinja. Posisi dan arah semprotan menjadi bagian dari desain produk.','assets/urinals_pair.jpg','Pilihan subsistem dari sintesis riset','', 'benchmark',[1,5,1,4,4,5]),
  C('ist-handheld','istinja','Semprotan Genggam','Semprotan air menggunakan selang fleksibel yang dapat diambil dan diarahkan oleh pengguna. Membutuhkan tempat penyimpanan dan pengaturan selang yang baik.','assets/full_cubicle.jpg','Acuan penggunaan / pembanding','', 'benchmark',[1,5,2,5,2,4]),
  C('ist-integrated-handwash','istinja','Cuci Tangan Terintegrasi','Basin cuci tangan menjadi bagian dari sistem urinoir, misalnya ditempatkan di atas basin urinoir. Aliran air dan bentuk basin dapat dirancang agar fasilitas ini juga mendukung kebutuhan istinja.','assets/commercial_detail.jpg','Hipotesis desain','', 'hypothesis',[1,5,3,5,3,3]),

  C('act-manual','activation','Manual','Pengguna mengaktifkan aliran air secara langsung melalui mekanisme fisik. Sistem sederhana, mudah dipahami, dan relatif mudah dirawat.','assets/commercial.jpg','Kondisi dasar','', 'benchmark',[1,3,1,4,4,5]),
  C('act-touchless','activation','Sensor Tanpa Sentuh','Aliran air diaktifkan tanpa menyentuh komponen menggunakan sensor, misalnya melalui gerakan tangan atau pendekatan pengguna.','assets/urinals_pair.jpg','Acuan komersial','', 'benchmark',[1,4,1,5,5,4]),
  C('act-presence','activation','Sensor Kehadiran','Sistem mendeteksi keberadaan pengguna dan mengaktifkan fungsi secara otomatis. Pengguna tidak perlu memberikan perintah secara langsung.','assets/commercial.jpg','Acuan komersial','', 'benchmark',[1,3,1,5,5,3]),
  C('act-foot','activation','Kontrol Kaki','Aktivasi dilakukan menggunakan kontrol yang dioperasikan dengan kaki sehingga tangan tidak perlu menyentuh komponen aktivasi.','assets/full_cubicle.jpg','Konsep eksploratif','', 'hypothesis',[1,4,1,4,4,3]),

  C('hand-separate','handwash','Cuci Tangan Terpisah','Fasilitas cuci tangan menggunakan wastafel atau fixture yang terpisah dari badan urinoir. Hubungan dengan urinoir hanya melalui tata letak ruang dan sistem utilitas.','assets/cubicle_corridor.jpg','Acuan instalasi / toilet','', 'benchmark',[1,5,2,4,4,4]),
  C('hand-integrated','handwash','Cuci Tangan Terintegrasi','Wastafel atau area cuci tangan menjadi bagian dari produk urinoir, misalnya ditempatkan di atas atau menyatu dengan badan urinoir.','assets/full_cubicle.jpg','Arah konsep desain','', 'hypothesis',[1,5,3,5,3,3]),

  C('priv-small','privacy','Divider Kecil','Pembatas berukuran kecil yang mengurangi pandangan langsung dari samping tanpa membuat ruang tertutup.','assets/divider_pair.jpg','Sintesis riset / antarmuka privasi','', 'benchmark',[2,1,3,5,4,5]),
  C('priv-extended','privacy','Partisi Memanjang','Pembatas yang lebih panjang untuk memberikan perlindungan visual lebih besar, tetapi membutuhkan ruang dan material lebih banyak.','assets/divider_pair.jpg','Acuan instalasi','', 'benchmark',[3,1,4,4,3,3]),
  C('priv-wing','privacy','Sayap Produk','Privasi dibentuk langsung oleh geometri badan produk sehingga tidak membutuhkan partisi terpisah.','assets/full_cubicle.jpg','Arah sintesis riset','', 'hypothesis',[4,1,4,4,3,3]),
  C('priv-cubicle','privacy','Kabin Penuh','Urinoir ditempatkan dalam kondisi ruang yang tertutup sehingga memberikan tingkat privasi visual paling tinggi.','assets/cubicle_corridor.jpg','Acuan lapangan / toilet','', 'benchmark',[4,1,5,3,3,3]),

  C('inst-adult','installation','Gantung Dinding Dewasa','Urinoir dipasang menggantung pada dinding dengan ketinggian yang ditujukan untuk penggunaan dewasa secara umum.','assets/commercial.jpg','Acuan instalasi','', 'benchmark',[2,1,2,5,5,5]),
  C('inst-lower','installation','Unit Lebih Rendah','Posisi pemasangan dibuat lebih rendah untuk menyesuaikan pengguna yang membutuhkan ketinggian berdiri lebih rendah.','assets/full_cubicle.jpg','Strategi aksesibilitas','', 'benchmark',[3,1,3,4,4,4]),
  C('inst-standing','installation','Baki Berdiri','Area berdiri dan area pengelolaan aliran dibuat lebih terdefinisi sehingga posisi pengguna dan pengelolaan sisa cairan lebih mudah diarahkan.','assets/full_cubicle.jpg','Acuan zona berdiri','', 'hypothesis',[4,2,3,3,2,3]),
  C('inst-modular','installation','Dudukan Modular','Antarmuka pemasangan memungkinkan beberapa konfigurasi instalasi tanpa harus mengubah bentuk utama basin.','assets/divider_pair.jpg','Strategi sistem instalasi','', 'hypothesis',[3,1,4,4,4,3])
];
const PRESETS={
  'Geometry First':{basin:'basin-deep30',aim:'aim-integrated',residual:'res-none',istinja:'ist-fixed',activation:'act-touchless',handwash:'hand-separate',privacy:'priv-wing',installation:'inst-adult'},
  'Containment First':{basin:'basin-deep30',aim:'aim-standing',residual:'res-honeycomb',istinja:'ist-fixed',activation:'act-touchless',handwash:'hand-separate',privacy:'priv-extended',installation:'inst-lower'},
  'Compact Public':{basin:'basin-optimized',aim:'aim-graphic',residual:'res-shield',istinja:'ist-integrated-handwash',activation:'act-touchless',handwash:'hand-integrated',privacy:'priv-small',installation:'inst-adult'}
};
const defaultState={version:'0.6.2',current:{id:'current',name:'Untitled Build',hypothesis:'',status:'LOADOUT',loadout:{},sketch:null,createdAt:Date.now(),updatedAt:Date.now()},saved:[],imageOverrides:{},componentOverrides:{},activeSlot:'basin',view:'library',inspectId:null,libraryMode:'large',slotMode:'compact'};
let state=structuredClone(defaultState);
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const uid=()=> 'b-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
const slotLabel=k=>SLOTS.find(x=>x[0]===k)?.[1]||k;
const shortLabel=k=>slotLabel(k).replace(' Profile','').replace(' / Rinse','');
function current(){return state.current}
function compById(id){const b=BASE_COMPONENTS.find(c=>c.id===id); if(!b)return null; return {...b,...(state.componentOverrides[id]||{})}}
function compsFor(slot){return BASE_COMPONENTS.filter(c=>c.slot===slot).map(c=>compById(c.id))}
function loadoutComp(slot){return compById(current().loadout[slot])}
function evidenceLabel(e){return e==='research'?'Berbasis riset':e==='benchmark'?'Acuan benchmark':'Hipotesis desain'}
function evidenceClass(e){return e==='research'?'research':e==='benchmark'?'benchmark':'hypothesis'}
function imageSrc(c){return state.imageOverrides?.[c.id]||window.MORPH_PUBLISHED_IMAGES?.[c.id]||c.image||''}
function imageBox(c,cover=true){const src=imageSrc(c); return src?`<img src="${esc(src)}" alt="${esc(c.name)}" style="object-fit:${cover?'cover':'contain'}">`:`<div class="empty">Foto belum ditambahkan</div>`}
function computeStats(build=current()){const out={}; DIMENSIONS.forEach(d=>out[d]={sum:0,w:0}); Object.entries(build.loadout||{}).forEach(([slot,id])=>{const c=compById(id); if(!c)return; DIMENSIONS.forEach(d=>{const w=SLOT_INFLUENCE[slot]?.[d]||0; if(w>0){out[d].sum += (c.stats[d]||0)*w; out[d].w += w}})}); const res={}; DIMENSIONS.forEach(d=>res[d]=out[d].w? +(out[d].sum/out[d].w).toFixed(2):0); return res}
function selectionScore(build=current()){const st=computeStats(build); let total=0; Object.entries(SELECTION_WEIGHTS).forEach(([d,w])=> total += ((st[d]||0)/5)*w); return +total.toFixed(1)}
function researchBackedCount(build=current()){return Object.values(build.loadout||{}).map(id=>compById(id)).filter(c=>c&&c.evidence==='research').length}
function evidenceMix(build=current()){const vals=Object.values(build.loadout||{}).map(id=>compById(id)?.evidence).filter(Boolean); if(!vals.length) return '—'; const r=vals.filter(v=>v==='research').length, b=vals.filter(v=>v==='benchmark').length, h=vals.filter(v=>v==='hypothesis').length; return `${r}R/${b}B/${h}H`}
function renderAll(){renderBuildStrip(); renderSlots(); renderLeft(); renderWorkspace(); setTabs()}
function renderBuildStrip(){
  $('#selectedBuildLabel').textContent=current().name||'Untitled Build';
  const presets=Object.keys(PRESETS).map(n=>`<button class="menu-item" data-preset="${esc(n)}"><span>${esc(n)}</span><em>Preset</em></button>`).join('');
  const saved=state.saved.length?state.saved.map(b=>`<button class="menu-item ${current().id===b.id?'active':''}" data-build="${b.id}"><span>${esc(b.name)}</span><em>${esc(b.status||'BUILD')}</em></button>`).join(''):`<div style="padding:9px;color:var(--muted);font-size:9px">Belum ada build tersimpan.</div>`;
  $('#buildMenu').innerHTML=`<div class="menu-head">Preset</div>${presets}<div class="menu-head">Build tersimpan</div>${saved}<div class="menu-head">Online</div><button class="menu-item" data-load-published><span>Muat ulang versi online</span><em>GitHub</em></button>`;
} 
function renderSlots(){
  const mode=state.slotMode||'compact';
  const root=$('#slots');
  root.className='slots '+mode;
  root.innerHTML=SLOTS.map(([key,label])=>{
    const c=loadoutComp(key);
    return `<button class="slot ${state.activeSlot===key?'active':''}" data-slot="${key}">
      <div class="labeltop">${esc(shortLabel(key))}</div>
      <div class="media">${c?imageBox(c):'<div class="placeholder">+</div>'}</div>
      <div class="labelbottom">${esc(c?.name||'Not selected')}</div>
    </button>`;
  }).join('');
  $$('.slotmodebtn').forEach(b=>b.classList.toggle('active',b.dataset.slotMode===mode));
  if(mode==='compact'){
    requestAnimationFrame(()=>{
      const cs=getComputedStyle(root);
      const panelH=root.clientHeight, panelW=root.clientWidth;
      const gap=parseFloat(cs.rowGap)||6, colGap=parseFloat(cs.columnGap)||6;
      const padTop=parseFloat(cs.paddingTop)||0, padBottom=parseFloat(cs.paddingBottom)||0;
      const padLeft=parseFloat(cs.paddingLeft)||0, padRight=parseFloat(cs.paddingRight)||0;
      const rows=Math.ceil(SLOTS.length/2), headerH=17;
      const maxCardW=(panelW-padLeft-padRight-colGap)/2;
      const rowH=(panelH-padTop-padBottom-gap*(rows-1))/rows;
      const square=Math.max(20,Math.floor(Math.min(maxCardW,rowH-headerH)));
      root.querySelectorAll('.slot').forEach(slot=>{
        slot.style.width=square+'px'; slot.style.height=(headerH+square)+'px';
        slot.style.justifySelf='center'; slot.style.alignSelf='center';
        const media=slot.querySelector('.media'); if(media){media.style.width=square+'px';media.style.height=square+'px'}
      });
    });
  }
}
function renderLeft(){ $('#currentBuildTitle').textContent=current().name||'Untitled Build'; $('#currentHyp').textContent=current().hypothesis||'Preset loadout — sesuaikan hipotesis ini sebelum digunakan sebagai klaim desain.'; $('#currentStatus').textContent=current().status||'LOADOUT'; $('#scoreQuick').textContent=selectionScore(); $('#equippedQuick').textContent=`${Object.keys(current().loadout||{}).length}/${SLOTS.length}`; $('#researchQuick').textContent=`${researchBackedCount()}/${SLOTS.length}`;
