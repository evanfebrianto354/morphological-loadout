<div class="app">
  <header class="topbar">
    <div class="brand"><div class="logo">ML</div><div><h1>Morphological Loadout</h1><p>Integrated Urinal Concept Builder · V0.5</p></div></div>
    <div class="build-selector-wrap" id="buildSelectorWrap">
      <button class="build-select" id="buildDropdownBtn" aria-expanded="false"><span><small>Current build</small><b id="selectedBuildLabel">Untitled Build</b></span><i>▾</i></button>
      <div class="build-menu" id="buildMenu"></div>
    </div>
    <div class="actions"><button class="btn ghost" id="newBuildBtn">+ New</button><button class="btn" id="duplicateBtn">Duplicate</button><button class="btn primary" id="saveBuildBtn">Save Build</button><button class="btn" id="exportBtn">Export</button><button class="btn" id="publishStateBtn" title="Download a published-state.js snapshot for GitHub Pages">Publish State</button><button class="btn" id="importBtn">Import</button><input type="file" id="importFile" accept=".json" hidden></div>
  </header>
  <main class="main">
    <section class="left">
      <div class="preview panel" id="previewCard">
        <div class="toolbar"><button class="btn" id="uploadSketchBtn">Upload Sketch</button><button class="btn" id="removeSketchBtn" style="display:none">Remove</button><input type="file" id="sketchFile" accept="image/png,image/jpeg,image/webp" hidden></div>
        <div class="preview-inner" id="previewInner"></div>
      </div>
      <div class="buildinfo">
        <div class="buildcopy">
          <div class="eyebrow">Current Archetype</div>
          <div class="buildname" id="currentBuildTitle">Untitled Build</div>
          <div class="buildhyp" id="currentHyp">No core hypothesis yet.</div>
          <div class="statusrow"><span class="chip"><i class="dot"></i><span id="currentStatus">LOADOUT</span></span><span class="chip">Predicted / hypothesis values</span></div>
        </div>
        <div class="buildedit">
          <div style="display:flex;justify-content:flex-end"><button class="btn" id="editBuildBtn">Edit</button></div>
          <div class="quickstats"><div class="q"><b id="scoreQuick">0</b><span>Selection Score</span></div><div class="q"><b id="equippedQuick">0/12</b><span>Slots Equipped</span></div><div class="q" title="Jumlah komponen yang didukung langsung oleh sumber riset/paper."><b id="researchQuick">0/12</b><span>Research-backed</span></div></div>
        </div>
      </div>

function card(c){const eq=current().loadout[c.slot]===c.id; return `<button class="card ${eq?'equipped':''}" data-component="${c.id}"><div class="img">${imageBox(c)}<span class="badge ${evidenceClass(c.evidence)}">${esc(evidenceLabel(c.evidence))}</span><div class="namebar"><b>${esc(c.name)}</b></div></div></button>`}
function componentDetail(c){if(!c)return '<div>Component not found.</div>'; const eq=current().loadout[c.slot]===c.id; return `<div class="detail"><div><div class="detailphoto">${imageBox(c)}<div class="source-vignette">${esc(c.source||evidenceLabel(c.evidence))}</div></div><div class="detailactions"><button class="btn ${eq?'':'cyan'}" data-equip="${c.id}">${eq?'Equipped ✓':'Equip'}</button><button class="btn" data-replace-photo="${c.id}">Replace Photo</button><input type="file" id="replace-${c.id}" accept="image/png,image/jpeg,image/webp" hidden><button class="btn" data-back-library>← Back</button></div></div><div class="detailcopy"><div class="eyebrow">${esc(slotLabel(c.slot))}</div><h2>${esc(c.name)}</h2><p>${esc(c.desc)}</p><div class="detailgrid"><div class="subcard"><h4>Predicted stats</h4>${DIMENSIONS.map(d=>`<div class="statrow"><span>${d}</span><div class="meter"><i style="width:${(c.stats[d]/5)*100}%"></i></div><b>${c.stats[d]}</b></div>`).join('')}</div><div class="subcard"><h4>Reference</h4><div class="source"><b>${esc(evidenceLabel(c.evidence))}</b><br>${esc(c.source||'No source assigned yet.')}${c.sourceUrl?`<br><br><a href="${esc(c.sourceUrl)}" target="_blank" rel="noopener">Open source ↗</a>`:''}<br><br>V0.2 prioritizes a clearer representative photo. You can replace any image if a better precedent photo is available.</div></div></div></div></div>`}
function buildView(){const st=computeStats(); const comps=SLOTS.map(([slot,label])=>({slot,label,c:loadoutComp(slot)})).filter(x=>x.c); const total=selectionScore(); return `<div class="stats-top"><div class="bigcard radar-card"><div class="eyebrow">Predicted build profile</div><h3>${esc(current().name)}</h3><div class="radarbox"><canvas id="radar" width="430" height="330"></canvas></div></div><div class="bigcard stats-card"><div class="eyebrow">Overall stats</div><div class="overalllist">${DIMENSIONS.map(d=>`<div class="overall"><span>${d}</span><div class="meter"><i style="width:${(st[d]/5)*100}%"></i></div><b>${st[d].toFixed(1)}</b></div>`).join('')}</div><div class="hypbox"><div class="eyebrow">Core hypothesis</div><p>${esc(current().hypothesis||'No hypothesis added yet. Use Edit to add a working design claim.')}</p></div></div></div><div class="selection-inline"><div class="selection-head"><div><div class="eyebrow">Selection matrix</div><h3 style="margin:2px 0 0">Weighted concept score</h3></div><div class="score">${total}<small> / 100</small></div></div><table class="table"><thead><tr><th>Criterion</th><th>Weight</th><th>Predicted</th><th>Weighted</th></tr></thead><tbody>${Object.entries(SELECTION_WEIGHTS).map(([d,w])=>`<tr><td>${d}</td><td>${w}%</td><td>${st[d].toFixed(1)} / 5</td><td>${((st[d]/5)*w).toFixed(1)}</td></tr>`).join('')}</tbody></table></div><div class="bigcard"><div class="eyebrow">Loadout breakdown</div><h3>Selected components</h3><div class="componentlist">${comps.map(x=>usedCard(x.label,x.c)).join('')}</div></div>`}
function usedCard(label,c){return `<div class="useitem"><div class="thumb">${imageBox(c)}</div><div><small>${esc(label)}</small><h4>${esc(c.name)}</h4><p>${esc(c.desc)}</p><div class="mini-stats">${DIMENSIONS.map(d=>`<div class="mini-stat"><span>${d}</span><b>${c.stats[d]}</b><div class="mini-meter"><i style="width:${(c.stats[d]/5)*100}%"></i></div></div>`).join('')}</div></div></div>`}
function selectionView(){const st=computeStats(), total=selectionScore(); return `<div class="matrix"><div class="bigcard"><div class="eyebrow">Weighted selection score</div><div class="score">${total}<small> / 100</small></div><table class="table"><thead><tr><th>Criterion</th><th>Weight</th><th>Predicted</th><th>Weighted</th></tr></thead><tbody>${Object.entries(SELECTION_WEIGHTS).map(([d,w])=>`<tr><td>${d}</td><td>${w}%</td><td>${st[d].toFixed(1)} / 5</td><td>${((st[d]/5)*w).toFixed(1)}</td></tr>`).join('')}</tbody></table></div><div class="bigcard"><div class="eyebrow">Reading note</div><div style="font-size:12px;line-height:1.65;color:var(--muted);margin-top:8px">This matrix evaluates the complete build. It is different from the per-component RPG-like stat system. For later versions, we can add <b>Observed</b> values from low-fi or dyed-water testing beside these predicted values.</div><div style="margin-top:14px" class="overalllist">${DIMENSIONS.map(d=>`<div class="overall"><span>${d}</span><div class="meter"><i style="width:${(st[d]/5)*100}%"></i></div><b>${st[d].toFixed(1)}</b></div>`).join('')}</div></div></div>`}
function drawRadar(){const c=$('#radar'); if(!c) return; const ctx=c.getContext('2d'), W=c.width,H=c.height, cx=W/2-18, cy=H/2+8, R=Math.min(W*.32,H*.35); ctx.clearRect(0,0,W,H); ctx.font='11px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; const st=computeStats(); const n=DIMENSIONS.length; for(let ring=1; ring<=5; ring++){ctx.beginPath(); DIMENSIONS.forEach((_,i)=>{const a=-Math.PI/2+i*2*Math.PI/n, r=R*(ring/5), x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y)}); ctx.closePath(); ctx.strokeStyle='#dbe4ea'; ctx.stroke()} DIMENSIONS.forEach((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/n; ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*R, cy+Math.sin(a)*R); ctx.strokeStyle='#e4eaef'; ctx.stroke(); const lx=cx+Math.cos(a)*(R+24), ly=cy+Math.sin(a)*(R+24); ctx.fillStyle='#647483'; ctx.fillText(d,lx,ly)}); ctx.beginPath(); DIMENSIONS.forEach((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/n, r=R*((st[d]||0)/5), x=cx+Math.cos(a)*r, y=cy+Math.sin(a)*r; i?ctx.lineTo(x,y):ctx.moveTo(x,y)}); ctx.closePath(); ctx.fillStyle='rgba(22,175,208,.23)'; ctx.fill(); ctx.strokeStyle='#16afd0'; ctx.lineWidth=3; ctx.stroke()}
function refreshEquippedCards(){document.querySelectorAll('[data-component]').forEach(el=>{const c=compById(el.dataset.component); el.classList.toggle('equipped',!!c&&current().loadout[c.slot]===c.id)})}
function openBuildModal(){showModal(`<h2>Edit build</h2><div class="form"><div class="field"><label>Build name</label><input id="fName" value="${esc(current().name)}"></div><div class="field"><label>Status</label><select id="fStatus">${['LOADOUT','SKETCHED','LOW-FI','TESTED','FINALIST'].map(v=>`<option ${current().status===v?'selected':''}>${v}</option>`).join('')}</select></div><div class="field full"><label>Core hypothesis</label><textarea id="fHyp">${esc(current().hypothesis||'')}</textarea></div></div><div class="modalactions"><button class="btn" data-close-modal>Cancel</button><button class="btn primary" id="applyBuildEdit">Apply</button></div>`); $('#applyBuildEdit').onclick=async()=>{current().name=$('#fName').value.trim()||'Untitled Build'; current().status=$('#fStatus').value; current().hypothesis=$('#fHyp').value.trim(); current().updatedAt=Date.now(); closeModal(); await persist(); renderAll(); toast('Build updated')}}
function showModal(html){const r=$('#modalRoot'); r.innerHTML=`<div class="modal">${html}</div>`; r.classList.add('open')}
function closeModal(){$('#modalRoot').classList.remove('open'); $('#modalRoot').innerHTML=''}
function toast(m){const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),1600)}
async function fileToDataURL(file,max=1800,quality=.86){return new Promise((resolve,reject)=>{const fr=new FileReader(); fr.onload=()=>{const img=new Image(); img.onload=()=>{const scale=Math.min(1,max/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*scale); c.height=Math.round(img.height*scale); c.getContext('2d').drawImage(img,0,0,c.width,c.height); resolve(c.toDataURL('image/jpeg',quality))}; img.onerror=reject; img.src=fr.result}; fr.onerror=reject; fr.readAsDataURL(file)})}
const DBNAME='MorphologicalLoadoutDB_v02', STORE='app', KEY='state';
function db(){return new Promise((resolve,reject)=>{const req=indexedDB.open(DBNAME,1); req.onupgradeneeded=()=>req.result.createObjectStore(STORE); req.onsuccess=()=>resolve(req.result); req.onerror=()=>reject(req.error)})}
async function persist(touch=true){if(touch) state._localUpdatedAt=Date.now(); try{const d=await db(); await new Promise((res,rej)=>{const tx=d.transaction(STORE,'readwrite'); tx.objectStore(STORE).put(state,KEY); tx.oncomplete=res; tx.onerror=()=>rej(tx.error)}); d.close()}catch(e){localStorage.setItem('morphlab-fallback-v02', JSON.stringify(state))}}
async function loadPublishedSnapshot(){window.MORPH_PUBLISHED_STATE=null; return new Promise(resolve=>{const old=document.getElementById('publishedStateScript'); if(old) old.remove(); const sc=document.createElement('script'); sc.id='publishedStateScript'; sc.src='published-state.js?v='+Date.now(); sc.onload=()=>resolve(window.MORPH_PUBLISHED_STATE||null); sc.onerror=()=>resolve(null); document.head.appendChild(sc)})}
async function restore(){let local=null; try{const d=await db(); local=await new Promise((res,rej)=>{const tx=d.transaction(STORE,'readonly'); const r=tx.objectStore(STORE).get(KEY); r.onsuccess=()=>res(r.result||null); r.onerror=()=>rej(r.error)}); d.close()}catch(e){try{const x=localStorage.getItem('morphlab-fallback-v02'); if(x)local=JSON.parse(x)}catch(_){}} const pub=window.MORPH_PUBLISHED_STATE; if(pub){const pubAt=pub._publishedAt||0, localAt=local?Math.max(local._localUpdatedAt||0,local._publishedAt||0):0; state=(!local||pubAt>localAt)?structuredClone(pub):local}else if(local){state=local} if(!state.libraryMode) state.libraryMode='large'}
async function forcePublished(){const pub=await loadPublishedSnapshot(); if(!pub){toast('No published snapshot found');return} state=structuredClone(pub); state._localUpdatedAt=state._publishedAt||Date.now(); await persist(false); renderAll(); toast('Published version loaded')}
document.addEventListener('click', async e=>{const t=e.target.closest('button,[data-slot],[data-component],[data-equip],[data-preset],[data-build],[data-back-library],[data-replace-photo],[data-close-inspect],[data-library-mode],[data-load-published]'); if(!t) return; if(t.dataset.libraryMode){state.libraryMode=t.dataset.libraryMode; await persist(); state.inspectId=null; renderWorkspace(); setTabs(); return} if(t.hasAttribute('data-load-published')){$('#buildMenu').classList.remove('open'); await forcePublished(); return} if(t.id==='buildDropdownBtn'){const m=$('#buildMenu'); const open=!m.classList.contains('open'); m.classList.toggle('open',open); t.setAttribute('aria-expanded',open?'true':'false'); return} if(t.dataset.view){state.view=t.dataset.view; state.inspectId=null; renderAll(); return} if(t.dataset.slot){state.activeSlot=t.dataset.slot; state.view='library'; state.inspectId=null; renderSlots(); renderLeft(); if(!$('.tab[data-view=library]').classList.contains('active')){renderWorkspace();setTabs()} requestAnimationFrame(()=>document.getElementById('section-'+t.dataset.slot)?.scrollIntoView({block:'start'})); return} if(t.dataset.component){state.inspectId=t.dataset.component; state.activeSlot=compById(t.dataset.component).slot; renderSlots(); renderLeft(); return} if(t.dataset.equip){const c=compById(t.dataset.equip); current().loadout[c.slot]=c.id; state.activeSlot=c.slot; current().updatedAt=Date.now(); await persist(); renderSlots(); renderLeft(); refreshEquippedCards(); renderBuildStrip(); toast(c.name+' equipped'); return} if(t.dataset.backLibrary!==undefined){state.inspectId=null; renderLeft(); return} if(t.dataset.preset){$('#buildMenu').classList.remove('open'); current().loadout={...PRESETS[t.dataset.preset]}; current().name=t.dataset.preset; current().hypothesis='Preset loadout — edit this hypothesis before using it as a design claim.'; current().updatedAt=Date.now(); await persist(); renderAll(); toast('Preset loaded'); return} if(t.dataset.build){$('#buildMenu').classList.remove('open'); const b=state.saved.find(x=>x.id===t.dataset.build); if(b){state.current=structuredClone(b); await persist(); renderAll()} return} if(t.dataset.replacePhoto){$('#replace-'+t.dataset.replacePhoto)?.click(); return} if(t.hasAttribute('data-close-inspect')){state.inspectId=null; renderLeft(); return} if(t.hasAttribute('data-close-modal')){closeModal(); return}});
document.addEventListener('change', async e=>{ if(e.target.id?.startsWith('replace-')){const id=e.target.id.replace('replace-',''), file=e.target.files?.[0]; if(!file) return; state.imageOverrides[id]=await fileToDataURL(file,1400,.84); await persist(); renderAll(); toast('Photo replaced'); }});
$('#newBuildBtn').onclick=async()=>{state.current={id:'current',name:'Untitled Build',hypothesis:'',status:'LOADOUT',loadout:{},sketch:null,createdAt:Date.now(),updatedAt:Date.now()}; state.inspectId=null; await persist(); renderAll(); toast('New build ready')};
$('#duplicateBtn').onclick=async()=>{const old=current(); state.current={...structuredClone(old),id:'current',name:(old.name||'Build')+' Copy',createdAt:Date.now(),updatedAt:Date.now()}; await persist(); renderAll(); toast('Build duplicated')};
$('#editBuildBtn').onclick=openBuildModal;
$('#saveBuildBtn').onclick=async()=>{const b=structuredClone(current()); if(!b.name || b.name==='Untitled Build'){openBuildModal(); toast('Name the build first'); return} const existing=state.saved.findIndex(x=>x.id===b.id && b.id!=='current'); if(b.id==='current') b.id=uid(); if(existing>=0) state.saved[existing]=b; else {const byName=state.saved.findIndex(x=>x.name===b.name); if(byName>=0){b.id=state.saved[byName].id; state.saved[byName]=b}else state.saved.push(b)} state.current=structuredClone(b); await persist(); renderAll(); toast('Build saved')};
$('#uploadSketchBtn').onclick=()=>$('#sketchFile').click(); $('#sketchFile').onchange=async e=>{const f=e.target.files?.[0]; if(!f) return; current().sketch=await fileToDataURL(f,2200,.88); if(current().status==='LOADOUT') current().status='SKETCHED'; await persist(); renderAll(); toast('Sketch attached')};
$('#removeSketchBtn').onclick=async()=>{current().sketch=null; await persist(); renderAll(); toast('Sketch removed')};
$('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='Morphological_Loadout_Project_v05.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),500); toast('Project exported')};
$('#publishStateBtn').onclick=()=>{const snapshot=structuredClone(state); snapshot._publishedAt=Date.now(); snapshot._localUpdatedAt=snapshot._publishedAt; snapshot.version='0.5'; const payload='// Auto-generated by Morphological Loadout V0.5\nwindow.MORPH_PUBLISHED_STATE = '+JSON.stringify(snapshot,null,2)+';\n'; const blob=new Blob([payload],{type:'text/javascript'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='published-state.js'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),500); toast('Publish snapshot downloaded')};
$('#importBtn').onclick=()=>$('#importFile').click(); $('#importFile').onchange=async e=>{const f=e.target.files?.[0]; if(!f) return; try{state=JSON.parse(await f.text()); await persist(); renderAll(); toast('Project imported')}catch(err){alert('Import failed: '+err.message)}};
$('#modalRoot').addEventListener('click', e=>{if(e.target.id==='modalRoot') closeModal()}); document.addEventListener('click',e=>{if(!e.target.closest('#buildSelectorWrap')){$('#buildMenu')?.classList.remove('open')} if(state.inspectId && !e.target.closest('#inspectOverlay') && !e.target.closest('[data-component]')){state.inspectId=null; renderLeft()}});
(async function(){await loadPublishedSnapshot(); await restore(); if(state.view==='selection') state.view='build'; if(!state.libraryMode) state.libraryMode='large'; state.version='0.5'; renderAll()})();
</script></body></html>
